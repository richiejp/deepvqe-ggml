model:
  mic_channels: [2, 64, 128, 128, 128, 128]
  far_channels: [2, 32, 128]
  align_hidden: 32
  dmax: 32
  align_temp_start: 1.0
  align_temp_end: 0.1
  align_temp_epochs: 20
  power_law_c: 0.3

audio:
  sample_rate: 16000
  n_fft: 512
  hop_length: 256
  n_freqs: 257  # n_fft // 2 + 1

training:
  batch_size: 64
  grad_accum_steps: 2
  num_workers: 12
  optimizer: soap            # "schedulefree" or "soap"
  lr: 1.0e-3
  weight_decay: 5.0e-7
  epochs: 100
  clip_length_sec: 3.0
  amp: true
  grad_clip: 5.0
  warmup_epochs: 5
  checkpoint_every: 5
  keep_checkpoints: 5
  early_stop_patience: 0
  early_stop_min_delta: 1.0e-4
  delay_acc_min: 0.5
  erle_min_db: 3.0

loss:
  # Pure reconstruction loss — mag-L1 + time-L1 only.
  # No delay/entropy/energy supervision; model learns end-to-end.
  plcmse_weight: 0.0
  mag_l1_weight: 1.0
  time_l1_weight: 1.0
  sisdr_weight: 0.0
  smooth_l1_weight: 0.0
  smooth_l1_beta: 0.01
  energy_preservation_weight: 0.0
  energy_pres_mode: relative
  delay_weight: 0.0
  entropy_weight: 0.0
  mask_reg_weight: 0.0
  power_law_c: 0.3

data:
  clean_dir: "/workspace/deepvqe/datasets_fullband/clean"
  noise_dir: "/workspace/deepvqe/datasets_fullband/noise"
  rir_dir: "/workspace/deepvqe/datasets_fullband/impulse_responses"
  farend_dir: ""      # empty = reuse clean_dir
  snr_range: [5, 40]
  ser_range: [-10, 10]
  delay_range: [0, 320]  # ms
  max_delay_frames: 32   # matches dmax
  # Scenario coverage (backported from LocalVQE). Every prob is gated so
  # the identity baseline stays in the training distribution.
  single_talk_prob: 0.2          # far-end single-talk (ref active, mic silent)
  single_talk_nearend_prob: 0.12 # near-end single-talk (mic active, ref zeros)
  ref_active_no_echo_prob: 0.10  # ref has content but no echo (headphones / muted)
  silent_nearend_prob: 0.15      # in no-echo scenarios, zero near-end
  nonspeech_ref_prob: 0.20       # draw ref from noise pool (music / game audio)
  max_rir_length_ms: 500
  drr_range: [0, 20]
  rir_skip_prob: 0.05            # dry pass, prevents RIR fingerprinting
  dnsmos_ovrl_min: 3.0           # DNSMOS quality filter (0=disabled)
  num_val: 1000
  # Far-end / echo path realism (backported from LocalVQE).
  farend_aug:
    saturation_prob: 0.20
    drive_range: [1.0, 2.5]
    nonlin_family: "random"
    hardclip_prob: 0.03
    hardclip_thresh_range: [0.88, 0.98]
    speaker_eq_prob: 0.4
    eq_hpf_range: [80.0, 200.0]
    eq_lpf_range: [5000.0, 8000.0]
    eq_q_range: [0.5, 1.2]
    eq_bump_prob: 0.5
    eq_bump_freq_range: [200.0, 2500.0]
    eq_bump_gain_db_range: [-3.0, 5.0]
    ref_agc_prob: 0.20
    agc_threshold_db_range: [-24.0, -9.0]
    agc_ratio_range: [2.0, 4.0]
    agc_attack_ms: 5.0
    agc_release_ms: 50.0
    ref_gain_prob: 0.3
    ref_gain_db_range: [-20.0, 3.0]
    rir_crossfade_prob: 0.10
    ref_drift_prob: 0.15
    ref_drift_ppm_range: [-100.0, 100.0]
  # Near-end speaker path (pre-RIR so effects propagate through reverb).
  # Same transforms applied to clean target — model suppresses echo/noise,
  # it doesn't invert the near-end's AGC.
  nearend_aug:
    agc_prob: 0.20
    agc_threshold_db_range: [-24.0, -9.0]
    agc_ratio_range: [2.0, 4.0]
    agc_attack_ms: 5.0
    agc_release_ms: 50.0
    saturation_prob: 0.05
    drive_range: [1.0, 2.0]
    nonlin_family: "random"
  # Mic capture chain (post-mix).
  mic_aug:
    mic_eq_prob: 0.4
    mic_hpf_range: [80.0, 250.0]
    mic_lpf_range: [5000.0, 8000.0]
    mic_eq_q_range: [0.5, 1.2]
    mic_eq_bump_prob: 0.5
    mic_eq_bump_freq_range: [1500.0, 5000.0]
    mic_eq_bump_gain_db_range: [-3.0, 5.0]
    mic_hiss_prob: 0.15
    mic_hiss_snr_range: [35.0, 60.0]
    mic_hiss_pink_prob: 0.5
    mic_clip_prob: 0.03
    mic_clip_thresh_range: [0.85, 0.97]

eval:
  pesq_subset: 200
  dnsmos_subset: 100
  aecmos_subset: 100
  audio_samples: 10

paths:
  checkpoint_dir: ../checkpoints/train
  log_dir: ../logs/train
